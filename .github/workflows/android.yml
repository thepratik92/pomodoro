name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # CAP_BUILD=1 drops the service worker: assets ship inside the APK, and a
      # stale SW cache would keep serving them after an update.
      - name: Build web assets and sync to Android
        run: npm run build:android

      - name: Environment report
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          java -version 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "--- google-services.json ---"
          if [ -f android/app/google-services.json ]; then
            echo "present"
            grep -q '"client_type": *1' android/app/google-services.json \
              && echo "contains Android OAuth client (client_type 1)" \
              || echo "::warning::No client_type 1 — SHA-1 fingerprint was likely not registered before download."
          else
            echo "MISSING"
          fi
          echo "--- web assets synced into APK ---"
          ls android/app/src/main/assets/public/ | head

      - name: Check Firebase Android config is present
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing. Register the Android app"
            echo "::error::(io.github.thepratik92.tempo) in the Firebase console, download the file,"
            echo "::error::and commit it to android/app/ — native Google Sign-In cannot work without it."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set. The APK will be UNSIGNED,"
            echo "::warning::which Android refuses to install, and Google Sign-In will not work."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tempo-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
