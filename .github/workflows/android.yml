name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # CAP_BUILD=1 drops the service worker: assets ship inside the APK, and a
      # stale SW cache would keep serving them after an update.
      - name: Build web assets and sync to Android
        run: npm run build:android

      - name: Environment report
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          java -version 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "--- google-services.json ---"
          if [ -f android/app/google-services.json ]; then
            echo "present"
            grep -q '"client_type": *1' android/app/google-services.json \
              && echo "contains Android OAuth client (client_type 1)" \
              || echo "::warning::No client_type 1 — SHA-1 fingerprint was likely not registered before download."
          else
            echo "MISSING"
          fi
          echo "--- web assets synced into APK ---"
          ls android/app/src/main/assets/public/ | head

      - name: Check Firebase Android config is present
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing. Register the Android app"
            echo "::error::(io.github.thepratik92.tempo) in the Firebase console, download the file,"
            echo "::error::and commit it to android/app/ — native Google Sign-In cannot work without it."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set. The APK will be UNSIGNED,"
            echo "::warning::which Android refuses to install, and Google Sign-In will not work."
            exit 0
          fi

          # Shape of the stored secret, so a bad value is identifiable without
          # ever printing it. Lengths and counts only.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ')
          STRAY=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
          echo "secret length: ${#KEYSTORE_B64}"
          echo "after stripping whitespace: ${#CLEAN}"
          echo "characters outside the base64 alphabet: $STRAY"
          echo "length divisible by 4: $(( ${#CLEAN} % 4 == 0 ? 1 : 0 ))"

          # Strip CR/LF and stray whitespace: a secret pasted from Windows or
          # from a wrapped file carries characters base64 -d rejects outright.
          if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 even after stripping whitespace."
            echo "::error::Expected length is about 3616 for this keystore. Compare against the"
            echo "::error::numbers above: a different length means the stored secret is stale or"
            echo "::error::truncated; stray characters mean the clipboard held something else."
            exit 1
          fi

          # A partial paste decodes without error but yields a broken keystore,
          # which would otherwise surface as an obscure Gradle signing failure.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STOREPASS" > /tmp/ks.txt 2>&1; then
            echo "::error::Decoded, but keytool cannot open the keystore. Either the base64 is"
            echo "::error::incomplete or ANDROID_KEYSTORE_PASSWORD does not match. keytool said:"
            sed 's/^/    /' /tmp/ks.txt | head -5
            exit 1
          fi

          echo "Keystore OK ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)."
          # Printed so it can be checked against the fingerprint registered in
          # Firebase — a mismatch here is why Google Sign-In fails at runtime.
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$STOREPASS" 2>/dev/null \
            | grep -E "Alias name:|SHA1:" || true
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tempo-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
